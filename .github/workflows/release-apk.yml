name: Release APK

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Only release on tag push
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a version tag push - release skipped."
            exit 0
          fi

      - name: Decode signing keystore
        shell: bash
        env:
          BASE64_JKS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BASE64_JKS" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."
            echo "::error::Add these 4 repo secrets (Settings > Secrets and variables > Actions):"
            echo "::error::  ANDROID_KEYSTORE_BASE64             base64 -w0 release-keystore.jks"
            echo "::error::  ANDROID_KEYSTORE_ALIAS              e.g. socialgram"
            echo "::error::  ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD"
            echo "::error::  ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$BASE64_JKS" | base64 -d > release-keystore.jks

      - name: Build release APK (universal, all ABIs)
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release -t lib/main_production.dart --flavor production

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/app-production-release.apk