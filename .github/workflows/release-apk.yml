name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --no-analytics && yes | flutter doctor --android-licenses

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Assert signing secrets exist
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."
          echo "::error::Add these 4 repo secrets:"
          echo "::error::  1) ANDROID_KEYSTORE_BASE64   - base64 of your release-keystore.jks"
          echo "::error::  2) ANDROID_KEYSTORE_ALIAS   - e.g. socialgram"
          echo "::error::  3) ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD"
          echo "::error::  4) ANDROID_KEYSTORE_PASSWORD"
          exit 1

      - name: Build release APK (universal, all ABIs)
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release -t lib/main_production.dart --flavor production

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-production-release.apk