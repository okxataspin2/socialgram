name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --no-analytics

      - run: yes | flutter doctor --android-licenses

      - name: Decode signing keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Check release signing secrets
        if: secrets.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Add these repo secrets to publish:"
          echo "::error::ANDROID_KEYSTORE_BASE64 (base64 of your .jks keystore), ANDROID_KEYSTORE_ALIAS,"
          echo "::error::ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD, ANDROID_KEYSTORE_PASSWORD"
          exit 1

      - name: Build release APK (universal, all ABIs)
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release -t lib/main_production.dart --flavor production

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-production-release.apk