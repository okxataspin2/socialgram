name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --no-analytics

      - run: yes | flutter doctor --android-licenses

      - run: flutter pub get

      - name: Build release APK (universal, minified, debug-key signed)
        run: flutter build apk --release -t lib/main_production.dart --flavor production

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          prerelease: false
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-production-release.apk